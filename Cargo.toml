[package]
name = "atmos-lcd"
version = "0.1.0"
edition = "2024"

[dependencies]
cosmic-text = "0.19.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
jpeg-encoder = "0.7.1"
nvml-wrapper = "0.13.0"
rfd = "0.17.2"
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"] }
sysinfo = "0.39.6"
tiny-skia = "0.12.0"
tray-icon = "0.26.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Devices_HumanInterfaceDevice", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_System_Console", "Win32_System_Threading"] }

[profile.release]
strip = true
lto = true

[build-dependencies]
slint-build = "1.18.1"

# Slint's software renderer leaves the window blank after restoring from minimized
# (the full-repaint hint is overwritten by the buffer age). Local fix until upstream
# ships one; see patches/slint-sw-repaint-after-minimize.diff.
[patch.crates-io]
i-slint-backend-winit = { path = "patches/i-slint-backend-winit" }
